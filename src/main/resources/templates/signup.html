<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>アカウント作成</title>
</head>

<body>
	<h1>アカウント作成</h1>

	<form th:action="@{/signup}" th:object="${signupForm}" method="post">

		<div>
			<label for="email">メールアドレス</label>
			<input type="email" id="email" th:field="*{email}" required>
			<p th:errors="*{email}"></p>
			<p th:if="${emailError}" th:text="${emailError}"></p>
		</div>

		<div>
			<label for="name">ユーザー名</label>
			<input type="text" id="name" th:field="*{name}" maxlength="50" required>
			<p th:errors="*{name}"></p>
		</div>

		<div>
			<label for="password">パスワード</label>
			<input type="password" id="password" th:field="*{password}" required>
			<p th:errors="*{password}"></p>
		</div>

		<div>
			<label for="passwordConfirm">パスワード（確認用）</label>
			<input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" required>
			<p th:errors="*{passwordConfirm}"></p>
			<p th:if="${passwordError}" th:text="${passwordError}"></p>
		</div>

		<button type="submit" id="signupButton">アカウント作成</button>
	</form>

	<p>すでにアカウントをお持ちの方は
		<a th:href="@{/login}">ログイン</a>
	</p>
</body>

</html>
