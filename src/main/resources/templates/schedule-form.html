
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予定の新規登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>予定の新規登録</h1>
    <nav>
        <a th:href="@{/main}">ホーム</a>
        <a th:href="@{/schedule/new}">予定を登録</a>
        <a th:href="@{/income-expense/new}">収支を登録</a>
        <a th:href="@{/records}">編集・削除</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>予定情報を入力してください</h2>

        <form id="scheduleForm"
              th:action="@{/schedule/save}"
              th:object="${scheduleForm}"
              method="post">

            <label for="title">予定名 <span class="required">必須</span></label>
            <input id="title" type="text" th:field="*{title}"
                   maxlength="100" placeholder="例：学校の授業" required>

            <label for="date">日付 <span class="required">必須</span></label>
            <input id="date" type="date" th:field="*{date}" required>

            <div class="form-row">
                <div>
                    <label for="startTime">開始時刻</label>
                    <input id="startTime" type="time"
                           th:field="*{startTime}" required>
                </div>
                <div>
                    <label for="endTime">終了時刻</label>
                    <input id="endTime" type="time"
                           th:field="*{endTime}" required>
                </div>
            </div>

            <label for="genre">ジャンル</label>
            <select id="genre" th:field="*{genre}" required>
                <option value="">選択してください</option>
                <option value="学校">学校</option>
                <option value="アルバイト">アルバイト</option>
                <option value="プライベート">プライベート</option>
                <option value="その他">その他</option>
            </select>

            <label for="color">予定の色</label>
            <input id="color" type="color" th:field="*{color}" value="#4f75c2">

            <label for="memo">メモ</label>
            <textarea id="memo" th:field="*{memo}"
                      maxlength="500" placeholder="予定の詳細を入力"></textarea>

            <div class="form-actions">
                <button type="submit">予定を登録する</button>
                <a class="button button-secondary" th:href="@{/main}">戻る</a>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/schedule-form.js}"></script>
</body>
</html>
