<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予定・収支の編集・削除</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container">
        <h2>予定・収支の編集</h2>

        <!-- 更新用フォーム（/calendar/save に ID 付きで送信） -->
        <form th:action="@{/calendar/save}" th:object="${item}" method="post">
            <!-- どのデータを更新するか識別するための隠しID -->
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label>種別</label>
                <select th:field="*{type}" required>
                    <option value="SCHEDULE">予定</option>
                    <option value="INCOME">収入</option>
                    <option value="EXPENSE">支出</option>
                </select>
            </div>

            <div class="form-group">
                <label>日付</label>
                <input type="date" th:field="*{date}" required>
            </div>

            <div class="form-group">
                <label>タイトル・内容</label>
                <input type="text" th:field="*{title}" required>
            </div>

            <div class="form-group">
                <label>金額（円）</label>
                <input type="number" th:field="*{amount}">
            </div>

            <div class="form-group">
                <label>ジャンル</label>
                <input type="text" th:field="*{genre}">
            </div>

            <div class="form-group">
                <label>メモ</label>
                <textarea th:field="*{memo}" rows="3"></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">更新する</button>
                <a th:href="@{/calendar}" class="btn-cancel">戻る</a>
            </div>
        </form>

        <hr>

        <!-- 削除用フォーム -->
        <form th:action="@{/calendar/delete/{id}(id=${item.id})}" method="post" onsubmit="return confirm('本当に削除しますか？');">
            <button type="submit" class="btn-delete">このデータを削除する</button>
        </form>
    </main>
</body>
</html>
