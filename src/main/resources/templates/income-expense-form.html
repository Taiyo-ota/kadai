
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>収支の新規登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>収支の新規登録</h1>
    <nav>
        <a th:href="@{/main}">ホーム</a>
        <a th:href="@{/schedule/new}">予定を登録</a>
        <a th:href="@{/income-expense/new}">収支を登録</a>
        <a th:href="@{/records}">編集・削除</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>収入・支出を入力してください</h2>

        <form id="incomeExpenseForm"
              th:action="@{/income-expense/save}"
              th:object="${incomeExpenseForm}"
              method="post">

            <label for="type">区分 <span class="required">必須</span></label>
            <select id="type" th:field="*{type}" required>
                <option value="">選択してください</option>
                <option value="income">収入</option>
                <option value="expense">支出</option>
            </select>

            <label for="amount">金額（円） <span class="required">必須</span></label>
            <input id="amount" type="number" th:field="*{amount}"
                   min="1" step="1" placeholder="例：5000" required>

            <label for="date">日付 <span class="required">必須</span></label>
            <input id="date" type="date" th:field="*{date}" required>

            <label for="category">項目 <span class="required">必須</span></label>
            <select id="category" th:field="*{category}" required>
                <option value="">選択してください</option>
                <option value="アルバイト代">アルバイト代</option>
                <option value="食費">食費</option>
                <option value="交通費">交通費</option>
                <option value="学用品">学用品</option>
                <option value="娯楽費">娯楽費</option>
                <option value="その他">その他</option>
            </select>

            <label for="memo">メモ</label>
            <textarea id="memo" th:field="*{memo}"
                      maxlength="500" placeholder="例：飲食店での昼食代"></textarea>

            <div class="form-actions">
                <button type="submit">収支を登録する</button>
                <a class="button button-secondary" th:href="@{/main}">戻る</a>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/income-expense-form.js}"></script>
</body>
</html>
